<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fabian's Projects</title>
    <meta
      name="description"
      content="A collection of Fabian's open source projects, live demos, and recent GitHub activity."
    />
    <meta name="theme-color" content="#0d1117" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fabian's Projects" />
    <meta
      property="og:description"
      content="Explore Fabian's live projects, repositories, and recent GitHub activity."
    />
    <meta property="og:url" content="https://fabian20ro.github.io/" />
    <meta name="twitter:card" content="summary" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-s-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://github.com; connect-src 'self' https://api.github.com;"
    />
    <meta name="twitter:title" content="Fabian's Projects" />
    <meta
      name="twitter:description"
      content="Explore Fabian's live projects, repositories, and recent GitHub activity."
    />
    <link rel="canonical" href="https://fabian20ro.github.io/" />
    <link rel="preconnect" href="https://github.com" />
    <link rel="stylesheet" href="styles.css?v=20260310" />
    <script src="app.js?v=20260310" defer></script>
  </head>
  <body>
    <div class="container">
      <header>
        <h1 data-i18n="title">Fabian's Projects</h1>
        <div class="header-controls">
          <button id="lang-template" class="lang-toggle" type="button" aria-label="Toggle language">
            EN
          </button>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">
            <span class="theme-icon" aria-hidden="true"></span>
          </button>
        </div>
      </header>

      <p class="intro" data-i18n="intro">
        Hi, I'm Fabian. Here you'll find a collection of my open source projects.
      </p>

      <section>
        <h2 class="section-title" data-i18n="liveProjects">Live Projects</h2>
        <div id="live-projects" class="grid" aria-label="Live projects"></div>
      </section>

      <section>
        <h2 class="section-title" data-i18n="repositories">Repositories</h2>
        <div id="repositories" class="grid" aria-label="Repositories"></div>
      </section>

      <div id="thank-you-container" class="thank-you-message" aria-live="polite"></div>

      <section class="activity-section" aria-labelledby="recent-activity-title">
        <h2 id="recent-activity-title" class="section-title" data-i18n="recentActivity">
          Recent Activity
        </h2>
        <div id="activity-feed" class="activity-list" role="status" aria-live="polite">
          <div class="activity-loading" data-i18n="activityLoading">Loading activity...</div>
        </div>
      </section>

      <footer>
        <a id="all-projects-link" href="https://github.com/fabian20ro" data-i18n="viewAllGithub"
          >View all projects on GitHub &rarr;</a
        >
      </footer>
    </div>
  </body>
</html>
